name: Check Tanisten Learn

on:
  pull_request:
    paths: ["apps/learn/**", ".github/workflows/learn.yml"]
  push:
    branches: ["feature/learn-lms"]
    paths: ["apps/learn/**", ".github/workflows/learn.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/learn/package-lock.json
      - run: npm ci
      - run: npm run validate:curriculum
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  database-permissions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db --local
